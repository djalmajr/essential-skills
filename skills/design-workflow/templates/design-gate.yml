# Gate de design determinístico — copie para .github/workflows/design-gate.yml
# Requer os scripts da skill vendorizados no repo (scripts/design/) OU o repo
# de skills disponível no runner; ajuste os caminhos abaixo.
name: design-gate

on:
  pull_request:
    paths:
      - "DESIGN.md"
      - "src/**"

jobs:
  design-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Bun.YAML (usado pelos checks) existe a partir de 1.2.21
          bun-version: ">=1.2.21"

      # Estrutura/refs/contraste do próprio DESIGN.md (formato Google)
      - name: Lint DESIGN.md
        run: bunx @google/design.md lint DESIGN.md

      # Vocabulário fechado: classes proibidas fora do allowlist do x-parity
      - name: Check forbidden classes
        run: bun scripts/design/check-classes.ts --project .

      # Paridade exata token (YAML) ↔ CSS var
      - name: Check token mapping
        run: bun scripts/design/check-tokens.ts --project .
